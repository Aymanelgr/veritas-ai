server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;  # document uploads

    # API calls go to the backend container.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;  # LLM answers can take a while
    }

    # React Router handles URLs like /documents/2 in the browser:
    # serve index.html for any path that is not a real file.
    location / {
        try_files $uri /index.html;
    }
}

# Runs on GitHub's servers for every push and pull request.
# Tests that need Ollama skip themselves (no LLM in CI); everything else runs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # Throw-away PostgreSQL + pgvector and Redis for the integration tests.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas
          POSTGRES_DB: veritas_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U veritas" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://veritas:veritas@localhost:5432/veritas_test
      REDIS_URL: redis://localhost:6379/0
      VERITAS_DISABLE_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install Python dependencies (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          python -c "import nltk; nltk.download('punkt_tab'); nltk.download('stopwords')"
      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.paddlex
          key: models-${{ hashFiles('requirements.txt') }}
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
